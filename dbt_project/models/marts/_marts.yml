version: 2

models:
  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: dim_customers
    columns:
      - name: customer_unique_id
        tests: [unique, not_null]

  - name: dim_products
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: dim_sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: fct_order_items
    columns:
      - name: order_item_key
        tests: [unique, not_null]
      - name: customer_unique_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id
      - name: product_id
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: seller_id
        tests:
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: purchase_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: price_usd
        tests: [not_null]