version: 2

models:
  - name: stg_olist__customers
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: stg_olist__orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_olist__customers')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]

  - name: stg_olist__order_items
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_olist__orders')
              field: order_id
      - name: product_id
        tests:
          - relationships:
              to: ref('stg_olist__products')
              field: product_id
      - name: seller_id
        tests:
          - relationships:
              to: ref('stg_olist__sellers')
              field: seller_id

  - name: stg_olist__order_reviews
    columns:
      - name: review_id
        tests: [not_null]
      - name: review_score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false

  - name: stg_olist__products
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_olist__sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: stg_fx__rates
    columns:
      - name: rate_date
        tests: [unique, not_null]