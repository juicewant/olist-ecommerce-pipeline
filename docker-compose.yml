services:
  metabase:
    image: ghcr.io/motherduckdb/metabase-duckdb:latest
    container_name: olist-metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - ./warehouse:/data
      - metabase-data:/metabase-data
    restart: unless-stopped

volumes:
  metabase-data: